name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Job 1: Lint + Format ────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint dependencies
        run: uv pip install ruff --system

      - name: Check formatting
        run: ruff format --check zolt/ tests/ scripts/

      - name: Check style & correctness
        run: ruff check zolt/ tests/ scripts/

  # ─── Job 2: Type-check ──────────────────────────────────────────────────
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu --system
          uv pip install tokenizers datasets einops tqdm mypy --system
          uv pip install -e . --system

      - name: Run mypy
        run: mypy zolt/ --ignore-missing-imports --no-error-summary

  # ─── Job 3: Test + Coverage ─────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu --system
          uv pip install tokenizers datasets einops tqdm pytest pytest-cov --system
          uv pip install -e . --system

      - name: Install TypeScript compiler
        run: npm install --global typescript

      - name: Run smoke test
        run: python smoke_test.py
        timeout-minutes: 3

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v \
            --cov=zolt \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          name: zolt-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Job 4: Debug train loop ─────────────────────────────────────────────
  train-loop:
    name: Debug train loop
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu --system
          uv pip install tokenizers datasets einops tqdm --system
          uv pip install -e . --system

      - name: Run debug train (tiny config, CPU)
        run: python scripts/debug_train.py
        timeout-minutes: 5
