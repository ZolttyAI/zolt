[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zolt"
version = "0.1.0"
description = "zolt - Coding-Agent and Reasoning AI (zolttyAI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "tokenizers>=0.13.0",
    "datasets>=2.10.0",
    "einops>=0.6.0",
    "tqdm>=4.65.0",
]

[project.scripts]
zolt = "zolt.inference:main"

[tool.setuptools.packages.find]
include = ["zolt*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pip-audit>=2.7.0",
    "bandit[toml]>=1.7.0",
    "build>=1.0.0",
]
