# ruff configuration — https://docs.astral.sh/ruff/configuration/
# ruff.toml uses bare keys (no [tool.ruff] wrapper)

target-version = "py312"
line-length = 100
src = ["zolt", "tests", "scripts"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default args
    "B905",   # zip() without strict=
    "SIM108", # ternary instead of if/else
    "RUF022", # unsorted __all__ (preserves logical groupings and comments)
]

[lint.isort]
known-first-party = ["zolt"]
force-sort-within-sections = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
